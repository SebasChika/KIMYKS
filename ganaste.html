  <script>
    const simbolos = ["✨", "🎉"];
    function crearElemento() {
      const elemento = document.createElement("div");
      elemento.classList.add("lluvia");
      elemento.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
      elemento.style.left = Math.random() * window.innerWidth + "px";
      const size = Math.random() * 30 + 15;
      elemento.style.fontSize = size + "px";
      const duracion = Math.random() * 3 + 2;
      elemento.style.animationDuration = duracion + "s";
      document.body.appendChild(elemento);
      setTimeout(() => {
        elemento.remove();
      }, duracion * 1000);
    }
    setInterval(crearElemento, 200);
  </script>
