<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kimyks | Registro</title>
  <link rel="shortcut icon" href="imagenes/No_fondo-_2_.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/registro.css">
</head>

<body>

  <div id="negro"></div>
  <div id="contenedor">
    <form id="registroForm">
      <h2>Registro</h2>
      <img id="gatito" src="imagenes/gato_ayudante.png">



      <div class="input-box">
        <input id="usuario" type="text" required class="campo">
        <label for="usuario">Usuario</label>
      </div>

      <div class="input-box">
        <input id="correo" type="email" required class="campo">
        <label for="correo">Correo</label>
      </div>

      <div class="input-box">
        <input id="password" type="password" required class="campo">
        <label for="password">Contraseña</label>
      </div>

      <div class="extras">
        <label><input type="checkbox"> Recordar</label>
        <a href="login.html">¿Ya tienes una cuenta?</a>
      </div>

      <button type="submit" class="btn">Registrarse</button>
    </form>
  </div>


  <script src="js/registro.js"></script>
</body>

</html>
