<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kimyks | Login</title>
  <link rel="shortcut icon" href="imagenes/No_fondo-_2_.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chelsea+Market&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/registro.css">
</head>

<body>

  <div id="negro"></div>
  <div id="contenedor">
    <form id="registroForm">
      <h2 id="logg">Login</h2>
      <img id="gatito" src="imagenes/gato_ayudante.png">


      <div class="input-box">
        <input id="usuario" type="text" required class="campo">
        <label for="usuario">Usuario</label>
      </div>

      <div class="input-box">
        <input id="password" type="password" required class="campo">
        <label id="passwordd" for="password">Contraseña</label>
      </div>

      <div class="extras">
        <label><input id="check" type="checkbox"> Recordar</label>
        <a href="registro.html">¿No tienes una cuenta?</a>
      </div>

      <button type="submit" class="btn">Ingresar</button>
    </form>

    <div id="alerta" class="alarma">
      <img id="correcto" src="imagenes/No_fondo (2).png"><br>
      <p id="context">Contexto</p>
    </div>
  </div>


  <script src="js/login.js"></script>
</body>

</html>
